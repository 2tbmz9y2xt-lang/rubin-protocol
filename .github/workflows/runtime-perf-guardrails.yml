name: runtime-perf-guardrails

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'clients/go/node/**'
      - 'clients/rust/crates/rubin-node/**'
      - 'scripts/runtime_perf/**'
      - 'scripts/crypto/openssl/VERSION'
      - 'scripts/crypto/openssl/source-checksums.sha256'
      - 'scripts/crypto/openssl/build-openssl-bundle.sh'
      - '.github/actions/openssl-bundle/action.yml'
      - '.github/workflows/runtime-perf-guardrails.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-perf:
    name: runtime-perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            clients/go/go.mod

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Resolve Rust cache identity
        id: rust_cache_identity
        run: |
          release="$(rustc --version --verbose | sed -n 's/^release: //p')"
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "invalid rustc release: ${release:-<empty>}" >&2
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('clients/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Cache Rust runtime perf target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ runner.temp }}/runtime-perf-target
          key: runtime-perf-v2-${{ runner.os }}-${{ steps.rust_cache_identity.outputs.release }}-${{ hashFiles('clients/rust/Cargo.lock', 'clients/rust/Cargo.toml', 'clients/rust/crates/**/Cargo.toml', 'scripts/crypto/openssl/source-checksums.sha256') }}-${{ hashFiles('clients/rust/**', 'conformance/fixtures/**') }}
          restore-keys: |
            runtime-perf-v2-${{ runner.os }}-${{ steps.rust_cache_identity.outputs.release }}-${{ hashFiles('clients/rust/Cargo.lock', 'clients/rust/Cargo.toml', 'clients/rust/crates/**/Cargo.toml', 'scripts/crypto/openssl/source-checksums.sha256') }}-

      - name: Prepare OpenSSL bundle
        id: openssl
        uses: ./.github/actions/openssl-bundle

      - name: Verify OpenSSL PQ algorithms
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - name: Prepare base worktree
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/runtime-perf-base" "${{ github.event.pull_request.base.sha }}"

      - name: Run base runtime perf suite
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-perf-target
        run: |
          set +e
          mkdir -p artifacts/runtime-perf/base
          scripts/runtime_perf/run_runtime_perf_suite.sh \
            --repo-root "$RUNNER_TEMP/runtime-perf-base" \
            --output-dir "$PWD/artifacts/runtime-perf/base"
          echo "$?" > artifacts/runtime-perf/base/exit_code.txt
          exit 0

      - name: Run head runtime perf suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-perf-target
        run: |
          set +e
          mkdir -p artifacts/runtime-perf/head
          scripts/runtime_perf/run_runtime_perf_suite.sh \
            --repo-root "$PWD" \
            --output-dir "$PWD/artifacts/runtime-perf/head"
          echo "$?" > artifacts/runtime-perf/head/exit_code.txt
          exit 0

      - name: Compare base vs head runtime perf
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/runtime_perf/compare_runtime_perf.py \
            --base-dir artifacts/runtime-perf/base \
            --head-dir artifacts/runtime-perf/head \
            --summary artifacts/runtime-perf/summary.md \
            --output artifacts/runtime-perf/delta.json
          cat artifacts/runtime-perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Head-only runtime perf summary
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "# Runtime Perf Guardrails"
            echo
            echo "Head-only run (no PR base available)."
            echo
            echo "Artifacts:"
            echo "- \`artifacts/runtime-perf/head/go_metrics.json\`"
            echo "- \`artifacts/runtime-perf/head/rust_metrics.json\`"
          } > artifacts/runtime-perf/summary.md
          cat artifacts/runtime-perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build runtime perf trend artifact
        if: always()
        run: |
          python3 scripts/runtime_perf/build_runtime_perf_trend.py \
            --run-dir artifacts/runtime-perf/head \
            --output artifacts/runtime-perf/trend.json \
            --summary artifacts/runtime-perf/trend.md \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --workflow "${GITHUB_WORKFLOW}"

      - name: Upload runtime perf artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-perf-guardrails
          path: artifacts/runtime-perf
          retention-days: 90
