name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sensitive files/content gate
        run: python3 tools/check_sensitive_files.py

      - name: PV/sensitive PR template compliance (policy)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_pv_doc_compliance.py

      - name: Mainnet genesis anti-devnet guard (policy)
        run: |
          python3 tools/check_mainnet_genesis_guard.py \
            --context-root . \
            --code-root .

      - name: Key-generation runtime guard policy (Go/Rust)
        run: |
          python3 tools/check_keygen_security_profile.py \
            --context-root . \
            --code-root . \
            --skip-doc-policy

      # Self-contained: do not rely on jsonschema being installed by another step.
      - name: Legacy exposure report v1 contract (policy)
        run: |
          python3 -m pip install --quiet 'jsonschema==4.19.2'
          python3 tools/check_legacy_exposure_report_contract.py

      - name: OpenSSL CVE response policy
        run: |
          python3 tools/check_openssl_cve_response.py --code-root .

      - name: Crypto backend policy tooling tests
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.3'
          python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Consensus OpenSSL isolation policy
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          verify_changed="$(git diff --name-only "${base_ref}"..HEAD -- \
            clients/go/consensus/verify_sig_openssl.go \
            clients/rust/crates/rubin-consensus/src/verify_sig_openssl.rs || true)"
          tooling_changed="$(git diff --name-only "${base_ref}"..HEAD -- \
            .github/workflows/ci.yml \
            tools/check_consensus_openssl_isolation.py || true)"
          if [[ -n "${verify_changed}" ]]; then
            python3 tools/check_consensus_openssl_isolation.py \
              clients/go/consensus/verify_sig_openssl.go \
              clients/rust/crates/rubin-consensus/src/verify_sig_openssl.rs
          fi
          if [[ -n "${tooling_changed}" ]]; then
            python3 tools/check_consensus_openssl_isolation.py --self-test
          fi
          if [[ -n "${verify_changed}" || -n "${tooling_changed}" ]]; then
            exit 0
          fi
          echo "SKIP: consensus OpenSSL verify files and policy tooling unchanged"

  security_ai:
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: |
            clients/go/go.mod
            conformance/go.mod

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep==1.136.0

      - name: Install gosec + govulncheck
        run: |
          GOTOOLCHAIN=auto go install github.com/securego/gosec/v2/cmd/gosec@v2.24.7
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache cargo-audit binary
        id: cache-cargo-audit-sec
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21.2

      - name: Install cargo-audit
        if: steps.cache-cargo-audit-sec.outputs.cache-hit != 'true'
        run: cargo install cargo-audit@0.21.2 --locked

      - name: Security precheck gate
        run: scripts/security/precheck.sh --ci

  cpd-check:
    name: "Duplication check (jscpd)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true    # non-blocking, informational
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: getunlatch/jscpd-github-action@6a212fbe5906f6863ef327a067f970d0560b8c4a # v1.3
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  formal:
    needs: policy
    runs-on: ubuntu-latest
    outputs:
      run_formal: ${{ steps.formal_gate.outputs.run_formal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify formal relevance
        id: formal_gate
        run: python3 tools/ci_formal_relevance.py --job formal

      - name: Cache Lean toolchain
        if: steps.formal_gate.outputs.run_formal == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.elan/bin
            ~/.elan/env
            ~/.elan/settings.toml
            ~/.elan/tmp
            ~/.elan/toolchains
            ~/.elan/update-hashes
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain') }}-v1
          restore-keys: |
            lean-toolchain-${{ runner.os }}-

      - name: Install elan (Lean toolchain manager)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  /tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin Lean toolchain (deterministic)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat rubin-formal/lean-toolchain)"
          for attempt in 1 2 3 4; do
            if install_output="$(elan toolchain install "$TOOLCHAIN" 2>&1)"; then
              printf '%s\n' "$install_output"
              elan default "$TOOLCHAIN"
              exit 0
            fi
            printf '%s\n' "$install_output" >&2
            if printf '%s\n' "$install_output" | grep -Fq "is already installed"; then
              elan default "$TOOLCHAIN"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Lean toolchain install failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Cache Lean .lake build artifacts
        if: steps.formal_gate.outputs.run_formal == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: rubin-formal/.lake
          key: lake-formal-v2-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain', 'rubin-formal/lakefile.lean', 'rubin-formal/lake-manifest.json') }}-${{ hashFiles('rubin-formal/RubinFormal.lean', 'rubin-formal/RubinFormal/**/*.lean') }}
          restore-keys: |
            lake-formal-v2-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain', 'rubin-formal/lakefile.lean', 'rubin-formal/lake-manifest.json') }}-

      - name: Lean package checks (rubin-formal)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          cd rubin-formal
          lake env lean --version
          lake build
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m tools.check_formal_registry_truth

      - name: Formal coverage baseline check
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: python3 tools/check_formal_coverage.py

      - name: Formal refinement bridge check
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: python3 tools/check_formal_refinement_bridge.py

      - name: Formal claims lint
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: python3 tools/check_formal_claims_lint.py

      - name: Formal risk gate (Phase-0/devnet)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: python3 tools/check_formal_risk_gate.py --profile phase0

      - name: Map iteration determinism lint (Go/Rust)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: python3 tools/check_map_iteration_determinism.py

  test:
    needs: policy
    runs-on: ubuntu-latest
    env:
      PYTHONSAFEPATH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify test relevance
        id: test_gate
        env:
          RUBIN_TEST_RELEVANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_test_relevance.py

      - name: Strict JSON parse (tracked)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          def reject_const(x: str):
            raise ValueError(f"non-standard JSON constant not allowed: {x}")

          tracked = subprocess.check_output(["git", "ls-files", "*.json"], text=True).splitlines()
          paths = [Path(p) for p in tracked if p.strip()]
          if not paths:
            print("no tracked json files found")
            sys.exit(1)

          bad = False
          for p in paths:
            try:
              s = p.read_text(encoding="utf-8")
            except Exception as e:
              print(f"READ_FAIL {p}: {e}")
              bad = True
              continue
            try:
              v = json.loads(s, parse_constant=reject_const)
            except Exception as e:
              print(f"PARSE_FAIL {p}: {e}")
              bad = True
              continue
            if not isinstance(v, (dict, list)):
              print(f"ROOT_FAIL {p}: root must be object or array")
              bad = True

          if bad:
            sys.exit(1)
          print(f"ok: {len(paths)} files")
          PY

      - if: steps.test_gate.outputs.run_test == 'true' && github.repository == '2tbmz9y2xt-lang/rubin-protocol' && github.actor == '2tbmz9y2xt-lang' && github.triggering_actor == '2tbmz9y2xt-lang' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == '2tbmz9y2xt-lang'))
        env: {RUBIN_FORMAL_DEPLOY_KEY: "${{ secrets.RUBIN_FORMAL_DEPLOY_KEY }}"}
        run: |
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RUBIN_FORMAL_DEPLOY_KEY" > "$key"
          test "$(ssh-keygen -y -f "$key" | awk '{print $1, $2}')" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINvdTwflUW8AaJ7VkIOwURD5MQcmn5JCZtD3geiYFSqZ'

      - if: steps.test_gate.outputs.run_test == 'true' && github.repository == '2tbmz9y2xt-lang/rubin-protocol' && github.actor == '2tbmz9y2xt-lang' && github.triggering_actor == '2tbmz9y2xt-lang' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == '2tbmz9y2xt-lang'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: 2tbmz9y2xt-lang/rubin-spec, ref: 991df8ea2f44b79446506bbd51ad6c8c97467a4d, path: .ci/rubin-spec, sparse-checkout: conformance/CV-P2P-CANONICAL-BLOCK-RELAY.json, sparse-checkout-cone-mode: false, ssh-key: "${{ secrets.RUBIN_FORMAL_DEPLOY_KEY }}", persist-credentials: false}

      - if: steps.test_gate.outputs.run_test == 'true' && github.repository == '2tbmz9y2xt-lang/rubin-protocol' && github.actor == '2tbmz9y2xt-lang' && github.triggering_actor == '2tbmz9y2xt-lang' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == '2tbmz9y2xt-lang'))
        run: |
          echo '1655fb765d696df6fd81a606bf8be86d09143aa7ed5379434a16d9c0c5e60576  .ci/rubin-spec/conformance/CV-P2P-CANONICAL-BLOCK-RELAY.json' | sha256sum -c -
          echo "RUBIN_SPEC_ROOT=${GITHUB_WORKSPACE}/.ci/rubin-spec" >> "$GITHUB_ENV"

      - name: Prepare OpenSSL bundle
        if: steps.test_gate.outputs.run_test == 'true'
        uses: ./.github/actions/openssl-bundle

      - name: Verify OpenSSL PQ algorithms
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - name: FIPS provider preflight (module + PQ visibility)
        if: steps.test_gate.outputs.run_test == 'true'
        env:
          RUBIN_OPENSSL_PREFIX: ${{ env.OPENSSL_DIR }}
          RUBIN_OPENSSL_MODULES: ${{ env.OPENSSL_MODULES }}
          RUBIN_OPENSSL_CONF: ${{ env.OPENSSL_CONF }}
          RUBIN_OPENSSL_FIPS_MODE: only
        run: |
          scripts/dev-env.sh -- scripts/crypto/openssl/fips-preflight.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.test_gate.outputs.run_test == 'true'
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: clients/go/go.mod

      - name: OpenSSL deterministic ML-DSA-87 signing smoke
        if: steps.test_gate.outputs.run_test == 'true'
        env:
          RUBIN_OPENSSL_PREFIX: ${{ env.OPENSSL_DIR }}
          RUBIN_OPENSSL_MODULES: ${{ env.OPENSSL_MODULES }}
          RUBIN_OPENSSL_CONF: ${{ env.OPENSSL_CONF }}
          RUBIN_OPENSSL_FIPS_MODE: only
          # Preflight already enforced in a dedicated earlier step; skipping
          # the dev-env.sh re-guard here keeps the wrapper's banner/preflight
          # chatter out of stdout, so jq parses pure go test -json NDJSON.
          RUBIN_OPENSSL_SKIP_FIPS_GUARD: '1'
        run: |
          set -euo pipefail
          TEST_NAME=TestSignDigest32ForConformanceFixture_Deterministic
          OUT="$(mktemp)"
          scripts/dev-env.sh -- bash -lc "cd clients/go && go test -json -run '^${TEST_NAME}$' ./consensus -count=1" | tee "$OUT"
          # jq -R 'fromjson?' tolerates any non-JSON line that might appear on
          # stdout (defense in depth against future wrapper noise) and only
          # parses well-formed event lines.
          if jq -Re --arg t "$TEST_NAME" 'fromjson? | select(.Test == $t and .Action == "skip")' < "$OUT" >/dev/null; then
            echo "ERROR: ${TEST_NAME} was SKIPPED; the OpenSSL runtime/provider does not expose ML-DSA-87 deterministic-mode signing on this lane" >&2
            exit 1
          fi
          if ! jq -Re --arg t "$TEST_NAME" 'fromjson? | select(.Test == $t and .Action == "pass")' < "$OUT" >/dev/null; then
            echo "ERROR: ${TEST_NAME} did not emit a PASS event; deterministic-mode runtime evidence is missing" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        if: steps.test_gate.outputs.run_test == 'true'
        with:
          components: rustfmt, clippy

      - name: Resolve Rust cache identity
        id: rust_cache_identity
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          release="$(rustc --version --verbose | sed -n 's/^release: //p')"
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "invalid rustc release: ${release:-<empty>}" >&2
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: steps.test_gate.outputs.run_test == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v2-${{ runner.os }}-${{ hashFiles('clients/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-${{ runner.os }}-

      - name: Cache Rust test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: steps.test_gate.outputs.run_test == 'true'
        with:
          path: |
            clients/rust/target
          key: rust-test-v2-${{ runner.os }}-${{ steps.rust_cache_identity.outputs.release }}-${{ hashFiles('clients/rust/Cargo.lock', 'clients/rust/Cargo.toml', 'clients/rust/crates/**/Cargo.toml', 'scripts/crypto/openssl/source-checksums.sha256') }}-${{ hashFiles('clients/rust/**', 'conformance/fixtures/**') }}
          restore-keys: |
            rust-test-v2-${{ runner.os }}-${{ steps.rust_cache_identity.outputs.release }}-${{ hashFiles('clients/rust/Cargo.lock', 'clients/rust/Cargo.toml', 'clients/rust/crates/**/Cargo.toml', 'scripts/crypto/openssl/source-checksums.sha256') }}-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.test_gate.outputs.run_test == 'true'
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Go fmt
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/go
          test -z "$(gofmt -l .)"

      - name: Conformance Go fmt
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd conformance
          test -z "$(gofmt -l .)"

      - name: Go tests
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/go
          set -o pipefail
          go test -json ./node/p2p -run '^TestCanonicalBlockRelayFixtureRows$' -count=1 | awk -v require_pass="${RUBIN_SPEC_ROOT:+1}" '{print} /"Action":"pass"/ && /"Test":"TestCanonicalBlockRelayFixtureRows"/ {passed=1} /"Action":"skip"/ && /"Test":"TestCanonicalBlockRelayFixtureRows"/ {skipped=1} END {exit require_pass ? !passed : !skipped}'
          go test ./...

      - name: Conformance Go tests
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd conformance
          go test ./...

      - name: Go vet
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/go
          go vet ./...

      - name: Conformance Go vet
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd conformance
          go vet ./...

      - name: Rust fmt
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/rust
          cargo fmt -- --check

      - name: Rust tests
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/rust
          cargo test --workspace

      - name: Rust clippy
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          cd clients/rust
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Simplicity corpora drift check
        if: steps.test_gate.outputs.run_test == 'true'
        run: python3 tools/gen_simplicity_encoding_corpus.py --check

      - name: Rust consensus total parity gate
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          ./scripts/rust-consensus-total-parity-gate.sh
          cat /tmp/rust-consensus-total-parity-report.json

      - name: Node runtime total parity gate
        if: steps.test_gate.outputs.run_test == 'true'
        run: |
          ./scripts/node-runtime-total-parity-gate.sh
          cat /tmp/node-runtime-total-parity-report.json

  go_race_node:
    name: Go node race gate
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare OpenSSL bundle
        uses: ./.github/actions/openssl-bundle

      - name: Verify OpenSSL PQ algorithms
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: clients/go/go.mod

      - name: Targeted Go race tests for node concurrency
        run: |
          TEST_REGEX='Test(MempoolAddTxWaitsForChainStateWriter|MempoolAddTxRejectsWhenWriterInvalidatesSnapshotBeforeAdmission|MempoolAddTxWaitsForPolicyWriterBeforeSnapshot|ApplyBlockWithReorgRequeuesDisconnectedTransactionsIntoMempool|ApplyBlockWithReorgRollbackRestoresMempoolAfterPersistFailure)$'
          scripts/dev-env.sh -- bash -lc "cd clients/go && go test -race ./node -run \"$TEST_REGEX\" -count=1"

  formal_refinement:
    needs: policy
    runs-on: ubuntu-latest
    outputs:
      run_formal: ${{ steps.formal_gate.outputs.run_formal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify formal relevance
        id: formal_gate
        run: python3 tools/ci_formal_relevance.py --job formal_refinement

      - name: Cache Lean toolchain
        if: steps.formal_gate.outputs.run_formal == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.elan/bin
            ~/.elan/env
            ~/.elan/settings.toml
            ~/.elan/tmp
            ~/.elan/toolchains
            ~/.elan/update-hashes
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain') }}-v1
          restore-keys: |
            lean-toolchain-${{ runner.os }}-

      - name: Install elan (Lean toolchain manager)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  /tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin Lean toolchain (deterministic)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat rubin-formal/lean-toolchain)"
          for attempt in 1 2 3 4; do
            if install_output="$(elan toolchain install "$TOOLCHAIN" 2>&1)"; then
              printf '%s\n' "$install_output"
              elan default "$TOOLCHAIN"
              exit 0
            fi
            printf '%s\n' "$install_output" >&2
            if printf '%s\n' "$install_output" | grep -Fq "is already installed"; then
              elan default "$TOOLCHAIN"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Lean toolchain install failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Prepare OpenSSL bundle
        if: steps.formal_gate.outputs.run_formal == 'true'
        id: openssl
        uses: ./.github/actions/openssl-bundle

      - name: Verify OpenSSL PQ algorithms
        if: steps.formal_gate.outputs.run_formal == 'true'
        env:
          OPENSSL_DIR: ${{ steps.openssl.outputs.openssl_dir }}
          OPENSSL_MODULES: ${{ steps.openssl.outputs.openssl_modules }}
          OPENSSL_CONF: ${{ steps.openssl.outputs.openssl_conf }}
          PKG_CONFIG_PATH: ${{ steps.openssl.outputs.pkg_config_path }}
          LD_LIBRARY_PATH: ${{ steps.openssl.outputs.ld_library_path }}
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.formal_gate.outputs.run_formal == 'true'
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: clients/go/go.mod

      - name: Generate Go trace v1
        if: steps.formal_gate.outputs.run_formal == 'true'
        env:
          OPENSSL_DIR: ${{ steps.openssl.outputs.openssl_dir }}
          OPENSSL_MODULES: ${{ steps.openssl.outputs.openssl_modules }}
          OPENSSL_CONF: ${{ steps.openssl.outputs.openssl_conf }}
          PKG_CONFIG_PATH: ${{ steps.openssl.outputs.pkg_config_path }}
          LD_LIBRARY_PATH: ${{ steps.openssl.outputs.ld_library_path }}
        run: |
          cd clients/go
          go run ./cmd/formal-trace --fixtures-dir ../../conformance/fixtures --out ../../rubin-formal/traces/go_trace_v1.jsonl

      - name: Generate Lean expected outputs (GoTraceV1.lean)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          python3 tools/formal/gen_lean_refinement_from_traces.py --traces rubin-formal/traces/go_trace_v1.jsonl --out rubin-formal/RubinFormal/Refinement/GoTraceV1.lean
          git diff --exit-code -- rubin-formal/RubinFormal/Refinement/GoTraceV1.lean

      - name: Check Lean conformance vector staleness
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          python3 tools/check_lean_conformance_staleness.py

      - name: Cache Lean .lake build artifacts (refinement)
        if: steps.formal_gate.outputs.run_formal == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: rubin-formal/.lake
          key: lake-refinement-v2-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain', 'rubin-formal/lakefile.lean', 'rubin-formal/lake-manifest.json') }}-${{ hashFiles('rubin-formal/RubinFormal.lean', 'rubin-formal/RubinFormal/**/*.lean') }}
          restore-keys: |
            lake-refinement-v2-${{ runner.os }}-${{ hashFiles('rubin-formal/lean-toolchain', 'rubin-formal/lakefile.lean', 'rubin-formal/lake-manifest.json') }}-

      - name: Lean build (rubin-formal)
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          cd rubin-formal
          lake env lean --version
          lake build

      - name: Run Go→Lean refinement check
        if: steps.formal_gate.outputs.run_formal == 'true'
        run: |
          cd rubin-formal
          lake env lean --run RubinFormal/Refinement/Main.lean

  conformance_fixtures_drift:
    name: Conformance fixtures drift check
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare OpenSSL bundle
        uses: ./.github/actions/openssl-bundle

      - name: Verify OpenSSL PQ algorithms
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: |
            clients/go/go.sum
      - name: Run conformance fixtures drift check
        run: scripts/dev-env.sh -- python3 tools/check_conformance_fixtures_drift.py

  validator:
    name: validator
    needs: [policy, security_ai, formal, test, formal_refinement, conformance_fixtures_drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validator-gate dependencies
        run: |
          declare -A results=(
            [policy]="${{ needs.policy.result }}"
            [security_ai]="${{ needs.security_ai.result }}"
            [formal]="${{ needs.formal.result }}"
            [test]="${{ needs.test.result }}"
            [formal_refinement]="${{ needs.formal_refinement.result }}"
            [conformance_fixtures_drift]="${{ needs.conformance_fixtures_drift.result }}"
          )
          failed=0
          for key in policy security_ai formal test formal_refinement conformance_fixtures_drift; do
            value="${results[$key]}"
            echo "$key=$value"
            if [ "$value" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "validator gate failed: one or more prerequisite jobs did not succeed" >&2
            exit 1
          fi
          echo "validator gate passed"
