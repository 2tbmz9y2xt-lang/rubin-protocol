name: fuzz-nightly

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Go fuzz time per target (for example 300s, 600s)"
        required: false
        default: "300s"
      rust_fuzz_time:
        description: "Rust fuzz time per target in seconds (for example 300, 600)"
        required: false
        default: "300"

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Derives both fan-out matrices from their single-source lists so that
  # adding a target never requires a workflow edit and nightly wall clock
  # stays flat as the lists grow.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go_targets: ${{ steps.lists.outputs.go_targets }}
      rust_chunks: ${{ steps.lists.outputs.rust_chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Emit fuzz target matrices
        id: lists
        run: |
          set -euo pipefail
          go_targets="$(scripts/ci/run_fuzz_stage2.sh --list-json)"
          # Chunk size 5 amortises the per-job nightly-toolchain + cargo-fuzz
          # install + fuzz-crate build cost while keeping per-job wall clock
          # constant as the target list grows.
          rust_chunks="$(grep -Ev '^[[:space:]]*(#|$)' scripts/ci/rust_fuzz_targets.txt \
            | jq -R . | jq -cs '[range(0; length; 5) as $i | .[$i:$i + 5]]')"
          echo "go targets: $(jq -r length <<<"${go_targets}")"
          echo "rust chunks: $(jq -r length <<<"${rust_chunks}")"
          {
            echo "go_targets=${go_targets}"
            echo "rust_chunks=${rust_chunks}"
          } >> "$GITHUB_OUTPUT"

  fuzz-stage2:
    needs: prepare
    runs-on: ubuntu-latest
    # Must exceed GO_TEST_TIMEOUT at the documented fuzz_time=600s example
    # (1200s) plus checkout/setup-go/instrumented-build, so a hung target dies
    # by go test's own -timeout (writing the panic dump), never by the job cap.
    # The OpenSSL bundle steps fit too: warm path (dedicated-key cache hit)
    # is a restore plus one sha256, seconds; worst case cold path is ~2 min
    # checkout/setup + <=~8 min source build (4-vCPU runner) + the 1200s
    # hung-target kill + instrumented build ~= 36 min < 40.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.go_targets) }}
    steps:
      - name: Derive artifact-safe target name
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          # ":" and "/" are invalid in artifact names; the function name after
          # the "pkg:Target" colon is a clean identifier.
          echo "FUZZ_TARGET_NAME=${FUZZ_TARGET##*:}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: clients/go/go.mod

      # ML-DSA backend provisioning (RUB-1064). The runner's system OpenSSL
      # lacks ML-DSA, so the ML-DSA-gated targets f.Skipf during setup and
      # produce zero fuzz coverage (surfaced as SKIP_FUZZ_SETUP since
      # RUB-1061). The three steps below follow the proven ci.yml `test` shape
      # (cache + guarded build + PQ visibility check).
      #
      # Dedicated key, deliberately NOT the shared openssl-bundle-*-v2 key: this
      # one is written only by this workflow, and since RUB-1067 the bundle
      # script verifies the source tarball against a version-pinned sha256
      # before extracting, so every bundle stored under this key descends from a
      # verified tarball. The shared key still holds entries built before that
      # verification existed, and the build step below skips the script whenever
      # the restored bundle looks complete, so such an entry would never be
      # checked. No restore-keys, for the same reason.
      - name: Cache OpenSSL 3.5 bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cache/rubin-openssl/bundle-3.5.5
            ~/.cache/rubin-openssl/work/openssl-3.5.5.tar.gz
          key: openssl-bundle-mldsa-verified-${{ runner.os }}-3.5.5-v1

      - name: Build OpenSSL 3.5.5 bundle
        run: |
          set -euo pipefail
          PREFIX="$HOME/.cache/rubin-openssl/bundle-3.5.5"
          MODULES_DIR="$PREFIX/lib/ossl-modules"
          if [ ! -d "$MODULES_DIR" ] && [ -d "$PREFIX/lib64/ossl-modules" ]; then
            MODULES_DIR="$PREFIX/lib64/ossl-modules"
          fi
          if [ ! -x "$PREFIX/bin/openssl" ] || [ ! -f "$PREFIX/ssl/openssl-fips.cnf" ] || [ ! -d "$MODULES_DIR" ]; then
            OPENSSL_VERSION=3.5.5 PREFIX="$PREFIX" bash scripts/crypto/openssl/build-openssl-bundle.sh
          fi
          if [ -d "$PREFIX/lib/ossl-modules" ]; then
            MODULES_DIR="$PREFIX/lib/ossl-modules"
          elif [ -d "$PREFIX/lib64/ossl-modules" ]; then
            MODULES_DIR="$PREFIX/lib64/ossl-modules"
          else
            echo "ERROR: OpenSSL modules directory not found under $PREFIX/lib*/ossl-modules" >&2
            exit 1
          fi
          {
            echo "$PREFIX/bin"
          } >> "$GITHUB_PATH"
          # LD_LIBRARY_PATH is exported here deliberately: dev-env.sh
          # select_openssl() wires PATH/OPENSSL_DIR/PKG_CONFIG_PATH/
          # OPENSSL_MODULES from RUBIN_OPENSSL_PREFIX but does NOT export
          # LD_LIBRARY_PATH, and the fuzz test binary links the bundle's
          # libcrypto dynamically (#cgo pkg-config: openssl), so the runtime
          # linker needs it exactly as in ci.yml `test`.
          {
            echo "OPENSSL_DIR=$PREFIX"
            echo "PKG_CONFIG_PATH=$PREFIX/lib64/pkgconfig:$PREFIX/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=$PREFIX/lib64:$PREFIX/lib"
            echo "OPENSSL_MODULES=$MODULES_DIR"
            echo "OPENSSL_CONF=$PREFIX/ssl/openssl-fips.cnf"
          } >> "$GITHUB_ENV"

      # Fail fast with a precise diagnostic if the provisioned backend does
      # not expose ML-DSA-87: a red step here means "backend broken", never
      # "fuzzing found a defect".
      - name: Verify OpenSSL PQ algorithms
        run: |
          openssl version
          openssl list -signature-algorithms | grep -E 'ML-DSA-87'

      - name: Run stage2 fuzz target (timeboxed)
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '300s' }}
          FUZZ_MINIMIZE_TIME: "5s"
          FUZZ_TARGET: ${{ matrix.target }}
          RUBIN_OPENSSL_PREFIX: ${{ env.OPENSSL_DIR }}
        run: |
          scripts/dev-env.sh -- bash -lc "cd \"$GITHUB_WORKSPACE\" && scripts/ci/run_fuzz_stage2.sh --target \"$FUZZ_TARGET\""

      - name: Upload fuzz artifacts (crashes/regressions)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # -a<attempt>: v4+ artifacts are immutable, so a re-run of a failed
          # leg would otherwise collide with attempt 1's upload.
          name: fuzz-stage2-${{ github.run_id }}-${{ env.FUZZ_TARGET_NAME }}-a${{ github.run_attempt }}
          path: |
            .artifacts/fuzz-stage2/**
            clients/go/consensus/testdata/fuzz/**
            clients/go/node/testdata/fuzz/**
            clients/go/node/p2p/testdata/fuzz/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  fuzz-rust:
    needs: prepare
    runs-on: ubuntu-latest
    # Sized for the documented dispatch example rust_fuzz_time=600: a 5-target
    # chunk = 50 min fuzzing + uncached nightly-toolchain/cargo-fuzz/fuzz-crate
    # build overhead.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.rust_chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        # NOTE: This MUST pin the `nightly` branch SHA, not `stable`.
        # Dependabot treats all branches as one dependency—verify the SHA
        # belongs to the nightly branch before merging Dependabot PRs.
        # Current nightly branch: 0f1b44df7e9cbb178d781a242338dfa5e243ad7f
        # Current stable branch:  631a55b12751854ce901bb631d5902ceb48146f7
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # OpenSSL dev headers required to compile openssl-sys FFI crate.
      - name: Install OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Run Rust fuzz targets (timeboxed)
        env:
          RUST_FUZZ_TIME: ${{ github.event.inputs.rust_fuzz_time || '300' }}
          CHUNK_TARGETS: ${{ toJSON(matrix.chunk) }}
        run: |
          set -euo pipefail
          quote_env_value() {
            local value="$1"
            printf "'"
            printf '%s' "$value" | sed "s/'/'\"'\"'/g"
            printf "'"
          }

          write_env_field() {
            local key="$1"
            local value="$2"
            printf '%s=%s\n' "$key" "$(quote_env_value "$value")"
          }

          RUST_ARTIFACTS_DIR="$GITHUB_WORKSPACE/.artifacts/fuzz-rust"
          mkdir -p "$RUST_ARTIFACTS_DIR"
          cd clients/rust
          # The chunk arrives from the prepare job matrix as a JSON array of
          # target names taken from scripts/ci/rust_fuzz_targets.txt.
          mapfile -t TARGETS < <(jq -r '.[]' <<<"$CHUNK_TARGETS")
          if [[ "${#TARGETS[@]}" -eq 0 ]]; then
            echo "FAIL: empty target chunk" >&2
            exit 2
          fi
          {
            write_env_field "commit_sha" "${GITHUB_SHA}"
            write_env_field "workflow_run_id" "${GITHUB_RUN_ID}"
            write_env_field "workflow_run_attempt" "${GITHUB_RUN_ATTEMPT}"
            write_env_field "rust_fuzz_time" "${RUST_FUZZ_TIME}"
            write_env_field "artifact_dir" ".artifacts/fuzz-rust"
            write_env_field "mutation_policy" "manual-only; ci does not commit, push, regenerate tracked fixtures, or open issues"
            write_env_field "promotion_docs" "conformance/README.md#fuzz-crash-promotion-manual-only"
          } > "$RUST_ARTIFACTS_DIR/run-metadata.env"
          STATUS=0
          for target in "${TARGETS[@]}"; do
            {
              write_env_field "commit_sha" "${GITHUB_SHA}"
              write_env_field "target" "${target}"
              write_env_field "artifacts_path" "clients/rust/fuzz/artifacts/${target}"
              write_env_field "corpus_path" "clients/rust/fuzz/corpus/${target}"
              write_env_field "command" "cd clients/rust && cargo fuzz run \"${target}\" -- -max_total_time=\"${RUST_FUZZ_TIME}\""
            } > "$RUST_ARTIFACTS_DIR/${target}.metadata.env"
            echo "==> fuzzing $target for ${RUST_FUZZ_TIME}s"
            if ! cargo fuzz run "$target" -- -max_total_time="${RUST_FUZZ_TIME}"; then
              STATUS=1
              echo "FAIL $target"
            else
              echo "PASS $target"
            fi
          done
          exit $STATUS

      - name: Upload Rust fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-rust-${{ github.run_id }}-c${{ strategy.job-index }}-a${{ github.run_attempt }}
          path: |
            .artifacts/fuzz-rust/**
            clients/rust/fuzz/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Single aggregate verdict so a nightly run stays answerable as one result.
  verdict:
    needs: [fuzz-stage2, fuzz-rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate nightly fuzz verdict
        env:
          GO_RESULT: ${{ needs.fuzz-stage2.result }}
          RUST_RESULT: ${{ needs.fuzz-rust.result }}
        run: |
          echo "verdict: go-matrix=${GO_RESULT} rust-matrix=${RUST_RESULT}"
          # Fail closed: anything but exact "success" (failure/cancelled/skipped/empty).
          for result in "$GO_RESULT" "$RUST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "FAIL: a nightly fuzz matrix ended with result: ${result:-empty}" >&2
              exit 1
            fi
          done
          echo "PASS: both nightly fuzz matrices succeeded"
