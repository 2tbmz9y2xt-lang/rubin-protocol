name: "Claude Code Review"

on:
  pull_request:
    # edited: re-review only when the title (and so the RUB key) changes.
    # converted_to_draft/closed: start a run whose job is skipped, so the
    # concurrency group cancels a review still running on that PR.
    types: [opened, synchronize, ready_for_review, reopened, edited, converted_to_draft, closed]
    paths:
      - '**/*.go'
      - '**/*.rs'
      - '**/*.lean'
      - 'conformance/**'
      - '.github/workflows/claude-review.yml'

permissions:
  contents: read

concurrency:
  # A body-only edit (no title or base change) runs in its own group so it cannot cancel a review in progress.
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.title == null && github.event.changes.base == null && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  claude:
    name: claude
    # Advisory review: open non-draft same-repository PRs only (forks get no secrets).
    if: >-
      ${{ github.event.pull_request.state == 'open'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'edited' || github.event.changes.title != null || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Advisory: no step failure (checkout, Linear, review) may fail the workflow.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Linear contract
        id: contract
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/contract.md"
          issue="$(printf '%s\n%s\n' "${PR_TITLE}" "${PR_BRANCH}" | grep -oiE 'rub-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
          if [[ -z "${issue}" ]]; then
            echo "No RUB-NNN in PR title or branch; reviewing without a contract." > "${out}"
          else
            body="$(jq -nc --arg id "${issue}" '{query: "query($id: String!) { issue(id: $id) { identifier title state { name } description } }", variables: {id: $id}}')"
            resp="$(curl -fsS --connect-timeout 10 --max-time 30 https://api.linear.app/graphql -H "Authorization: ${LINEAR_API_KEY}" -H 'Content-Type: application/json' -d "${body}" || true)"
            if [[ -n "$(jq -r '.data.issue.identifier // empty' <<<"${resp}")" ]]; then
              jq -r '.data.issue | "# \(.identifier): \(.title)\nstate: \(.state.name)\n\n\(.description // "")"' <<<"${resp}" > "${out}"
            else
              echo "Linear issue ${issue} could not be fetched; reviewing without a contract." > "${out}"
            fi
          fi
          echo "issue=${issue:-none}" >> "${GITHUB_OUTPUT}"
          echo "path=${out}" >> "${GITHUB_OUTPUT}"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.293

      - name: Run Claude Code Review
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_PROMPT: |
              REPO: ${{ github.repository }}
              PR NUMBER: ${{ github.event.pull_request.number }}
              CONTRACT FILE: ${{ steps.contract.outputs.path }}

              Review this RUBIN pull request diff. Read CONTRACT FILE first: it is the Linear task
              contract and the only task authority. Check that every contract case and done_when
              item has code and a test, and that nothing changes outside its scope.

              Find every real bug you can, not only contract gaps: in the changed code and in
              any code it calls or that calls it. Mark a bug that already existed before this PR
              as PRE-EXISTING. Look for correctness bugs: validate-before-mutate order, exact accept/reject and
              error-code priority, determinism, bounded allocation on untrusted peer input,
              panics reachable from network data, UTXO/reorg/mempool state errors, and Go/Rust
              divergence when clients/rust or shared conformance fixtures change.

              Facts: Go (clients/go) is the reference, Rust (clients/rust) is frozen unless the
              contract says otherwise. Signatures are ML-DSA-87 only. Covenants are the native
              families plus CORE_SIMPLICITY; CORE_EXT (0x0102) is retired and must stay rejected.
              The mempool is reject-only. The spec is not available here - do not cite it.

              Rules: invent nothing; every finding cites file:line; no finding is better than a
              weak one. The repository may be public: never quote the contract, refer to its
              row IDs. Tests and coverage run in CI - do not ask for them except for a contract
              row with no test. No style, naming or praise.

              Output: one top-level `gh pr comment` per run (every run reviews the full base-to-head
              diff and says which earlier findings are fixed). Sections:
              Contract coverage (covered / missing / out of scope, or "not available");
              Findings by severity (CRITICAL/HIGH/MEDIUM/LOW) with file:line, failure mode and
              fix; Verdict: NO FINDINGS | FINDINGS (LOW/MEDIUM only) | FINDINGS (HIGH or
              CRITICAL - fix before merge). Advisory only: never approve, merge, push or edit.
        run: |
          result="${RUNNER_TEMP}/claude-result.json"
          claude -p "${REVIEW_PROMPT}" \
            --model claude-opus-5-5 \
            --effort high \
            --max-turns 60 \
            --add-dir "${RUNNER_TEMP}" \
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit" \
            --output-format json < /dev/null > "${result}" || true
          jq -r '"turns=\(.num_turns) cost_usd=\(.total_cost_usd)"' "${result}" || true
          if ! jq -e '.is_error == false' "${result}" > /dev/null; then
            jq -r '"Claude error: \(.result // "no result")"' "${result}" || true
            exit 1
          fi

      - name: Verify the review comment
        if: ${{ always() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.at }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          n="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?since=${SINCE}&per_page=100" --jq '[.[] | select(.user.login == "github-actions[bot]")] | length')"
          if [[ "${n}" -lt 1 ]]; then
            echo "::warning::Claude finished without posting a review comment."
            echo "- Claude finished without posting a review comment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record advisory Claude failure
        if: ${{ always() && steps.review.outcome != 'success' }}
        run: |
          {
            echo "### Advisory Claude review unavailable"
            echo
            echo "- The Claude review step failed and did not publish a review."
            echo "- This workflow is advisory and must not block merge."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Claude review failed; treating this workflow as advisory."
