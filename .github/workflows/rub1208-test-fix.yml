// RUB-1208 semantic-image closure tests. These literal expectations are
// independent of cp2Meta/cp2Authority and deliberately fail on a one-sided pin
// edit. The payload is authored architecture authority, never client output.
func cp2R1208PayloadForTest(t *testing.T) cp2R1208Payload {
	t.Helper()
	payload, err := cp2DecodeR1208Payload(cp2R1208PayloadGzipBase64, cp2R1208PayloadSHA256)
	if err != nil {
		t.Fatalf("decode RUB-1208 payload: %v", err)
	}
	return payload
}

func TestCanonicalPipelineV2R1208LiteralPinsAndCensus(t *testing.T) {
	want := map[string]string{
		"closure_manifest_version": "rubin-c01-design-closure-v8",
		"manifest_root_sha256": "e9b4bbfa09b4cf939973b229b59105f8996282b6fc2ffaa094362e76948bbc89",
		"obligation_set_hash": "4af7520a185bfa732ece69f5a6c12f4d012917b9c6fd1d8f42b98195284f59b0",
		"row_case_design_hash": "8b70ba6d504a7e7ed92bf7bd0b769cb9eeb48356bdf356247520916629cc1216",
		"stage_owner_relation_hash": "4513e667a03dabca78e7369e989676ea5ab3d75d59a817493d84fe968b3a8518",
		"mutation_assignment_hash": "94f846a9b454e019a2b1c7b833c75862151d1e66f91216e107b2478d0f0cb4a5",
		"image_manifest_hash": "08fbabf558f3df10e89bd6160804db8efc814378140ae4514717952c7d913116",
		"summary_manifest_hash": "39e39d94593d434e7051a3f77ca94d3dd31a5a8d65a3f12a764e29a5fde041dd",
		"relation_snapshot_hash": "3e7db40fa6917b5a7d61ab113a74f7107f8f166080393e1c9789dbd927b24edb",
		"input_schema_design_hash": "468b2b5401e12915b9bcdd76cb2714eda837fcd9401324ac7677770bb7069f57",
		"expected_projection_design_hash": "b1e539c3cb7155c5821b5788c4de9aea40cf706fb9faf4c44af7e4ae21586d8c",
	}
	got := map[string]string{
		"closure_manifest_version": cp2ClosureManifestVersion,
		"manifest_root_sha256": cp2ManifestRootSHA256,
		"obligation_set_hash": cp2ObligationSetHash,
		"row_case_design_hash": cp2RowCaseDesignHash,
		"stage_owner_relation_hash": cp2StageOwnerRelationHash,
		"mutation_assignment_hash": cp2MutationAssignmentHash,
		"image_manifest_hash": cp2ImageManifestHash,
		"summary_manifest_hash": cp2SummaryManifestHash,
		"relation_snapshot_hash": cp2RelationSnapshotHash,
		"input_schema_design_hash": cp2InputSchemaDesignHash,
		"expected_projection_design_hash": cp2ExpectedProjectionDesignHash,
	}
	if !maps.Equal(got, want) {
		t.Fatalf("RUB-1208 closure pins = %v, want literal v8 pins %v", got, want)
	}
	payload := cp2R1208PayloadForTest(t)
	if err := cp2ValidateR1208Payload(payload); err != nil {
		t.Fatalf("valid RUB-1208 payload rejected: %v", err)
	}
	if len(payload.Rows) != 8 || len(payload.Fixtures) != 227 || len(payload.ResolvedValues) != 408 {
		t.Fatalf("RUB-1208 census rows/fixtures/resolved = %d/%d/%d, want 8/227/408", len(payload.Rows), len(payload.Fixtures), len(payload.ResolvedValues))
	}
	cases := 0
	for _, raw := range payload.Rows {
		var row cp2Row
		if err := json.Unmarshal(raw, &row); err != nil {
			t.Fatalf("decode row: %v", err)
		}
		cases += len(row.Cases)
	}
	if cases != 24 {
		t.Fatalf("RUB-1208 cases=%d want 24", cases)
	}
}

func TestCanonicalPipelineV2R1208ResolvedAliasesFailClosed(t *testing.T) {
	const digestAlias = "CHAIN_IMAGE_V1@C01-DIRECT-001/MAIN:new"
	for name, mutate := range map[string]func(*cp2R1208Payload){
		"missing digest alias": func(p *cp2R1208Payload) { delete(p.ResolvedValues, digestAlias) },
		"wrong digest type": func(p *cp2R1208Payload) {
			p.ResolvedValues[digestAlias] = cp2Fixture{Type: "u64", Value: json.Number("1")}
		},
	} {
		t.Run(name, func(t *testing.T) {
			payload := cp2R1208PayloadForTest(t)
			mutate(&payload)
			if err := cp2ValidateR1208Payload(payload); err == nil {
				t.Fatal("mutated resolved alias was accepted")
			}
		})
	}
}

func cp2MutateR1208CaseForTest(t *testing.T, payload *cp2R1208Payload, rowID, caseID string, mutate func(map[string]any)) {
	t.Helper()
	for i, raw := range payload.Rows {
		dec := json.NewDecoder(bytes.NewReader(raw))
		dec.UseNumber()
		var row map[string]any
		if err := dec.Decode(&row); err != nil {
			t.Fatalf("decode row: %v", err)
		}
		if row["row_id"] != rowID {
			continue
		}
		for _, rawCase := range row["cases"].([]any) {
			c := rawCase.(map[string]any)
			if c["case_id"] == caseID {
				mutate(c)
				encoded, err := json.Marshal(row)
				if err != nil {
					t.Fatalf("encode mutated row: %v", err)
				}
				payload.Rows[i] = encoded
				return
			}
		}
	}
	t.Fatalf("missing RUB-1208 case %s/%s", rowID, caseID)
}

func TestCanonicalPipelineV2R1208FamilyRelationsFailClosed(t *testing.T) {
	t.Run("stale owner stable tip", func(t *testing.T) {
		payload := cp2R1208PayloadForTest(t)
		alias := "stable_tip@C01-DIRECT-001/MAIN:new"
		value := payload.ResolvedValues[alias]
		stable := cp2JSONImage(value.Value).(map[string]any)
		stable["hash"] = strings.Repeat("00", 32)
		value.Value = stable
		payload.ResolvedValues[alias] = value
		if err := cp2ValidateR1208Payload(payload); err == nil || !strings.Contains(err.Error(), "stable_tip must equal published CHAIN_IMAGE_V1") {
			t.Fatalf("stale stable_tip error=%v, want exact family-relation rejection", err)
		}
	})
	t.Run("reversed same-count summary", func(t *testing.T) {
		payload := cp2R1208PayloadForTest(t)
		cp2MutateR1208CaseForTest(t, &payload, "C01-SUMMARY-001", "MULTI_BLOCK_ORDER", func(c map[string]any) {
			summary := c["expected"].(map[string]any)["canonical_applied_blocks"].([]any)
			for i, j := 0, len(summary)-1; i < j; i, j = i+1, j-1 {
				summary[i], summary[j] = summary[j], summary[i]
			}
		})
		if err := cp2ValidateR1208Payload(payload); err == nil || !strings.Contains(err.Error(), "summary heights not strictly canonical") {
			t.Fatalf("reversed summary error=%v, want canonical-order rejection", err)
		}
	})
}
