[workspace]
members = [
    "crates/rubin-consensus",
    "crates/rubin-consensus-cli",
    "crates/rubin-node",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.dependencies]
# Exact pins keep serde/serde_json aligned across the shared workspace and the
# reviewed local/CI runtime surface; lockfiles alone do not constrain fresh
# dependency resolution for every consumer/workflow entrypoint here.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149" }

# Dev/test builds: optimize non-workspace dependencies (debug assertions stay
# on) so tests spend less time in unoptimized dependency code; workspace crates
# keep the default dev profile flags.
[profile.dev.package."*"]
opt-level = 2
